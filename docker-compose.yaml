version: '3.8'
services:
  ledger-init:
    image: 'ethereum/client-go:v1.17.10'
    container_name: family-ledger-init
    volumes:
      - 'ledger-data:/root/.ethereum'
      - './genesis.json:/root/genesis.json'
    command:
      - init
      - '--datadir=/root/.ethereum'
      - /root/genesis.json
    restart: 'no'
  ledger-node:
    image: 'ethereum/client-go:v1.17.10'
    container_name: family-ledger
    restart: always
    depends_on:
      ledger-init:
        condition: service_completed_successfully
    ports:
      - '8545:8545'
      - '30303:30303'
    volumes:
      - 'ledger-data:/root/.ethereum'
      - './password.txt:/root/password.txt'
    command:
      - '--datadir=/root/.ethereum'
      - '--networkid=27744'
      - '--mine'
      - '--miner.gasprice=0'
      - '--miner.etherbase=0x0aca0b79de83a0761a5c57c8a1a239989cd254a6'
      - '--unlock=0x0aca0b79de83a0761a5c57c8a1a239989cd254a6'
      - '--password=/root/password.txt'
      - '--allow-insecure-unlock'
      - '--http'
      - '--http.addr=0.0.0.0'
      - '--http.corsdomain=*'
      - '--http.vhosts=*'
      - '--http.api=eth,net,web3,clique,miner,debug,txpool'
      - '--txlookuplimit=0'
      - '--gcmode=archive'
      - '--nodiscover'
  explorer-backend:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    image: 'ghcr.io/blockscout/blockscout:9.0.2'
    container_name: blockscout-backend
    command:
      - sh
      - '-c'
      - "/app/bin/blockscout eval \"Explorer.ReleaseTasks.create_and_migrate\" &&\n/app/bin/blockscout start\n"
    environment:
      - DATABASE_URL
      - 'ETHEREUM_JSONRPC_HTTP_URL=http://ledger-node:8545'
      - 'ETHEREUM_JSONRPC_TRACE_URL=http://ledger-node:8545'
      - CHAIN_ID=27744
      - COIN=MASH
      - NETWORK=Family
      - MIGRATION_PRIMARY=true
      - ECTO_USE_SSL=false
      - ETHEREUM_JSONRPC_VARIANT=geth
      - INDEXER_CATCHUP_INTERVAL=5000
  explorer-frontend:
    build:
      context: ./frontend
    container_name: blockscout-frontend
    ports:
      - '3000:80'
    environment:
      - NEXT_PUBLIC_NETWORK_ID=27744
      - NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL=MASH
      - 'NEXT_PUBLIC_NETWORK_CURRENCY_NAME=No i masz'
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - explorer-backend
volumes:
  ledger-data: null
