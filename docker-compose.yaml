version: '3.8'
# Family chain (MASH). Geth removed the Clique engine in v1.14, so this no longer
# runs a PoA signer. Instead the node runs in --dev mode, where geth's built-in
# simulated beacon seals a block every --dev.period seconds (300 = 5 minutes).
# That means: no signer key in the keystore, no --unlock, no password file.
services:
  ledger-node:
    image: 'ethereum/client-go:v1.17.10'
    container_name: family-ledger
    restart: always
    ports:
      - '8545:8545'
    volumes:
      - 'ledger-data:/root/.ethereum'
      - './genesis.json:/root/genesis.json:ro'
    command:
      - sh
      - '-c'
      - |
        # Idempotent: re-running init on an already initialized datadir is a no-op.
        # If this fails, the node must not start (otherwise geth would silently
        # fall back to its built-in dev chain with chain id 1337).
        geth init --datadir /root/.ethereum /root/genesis.json &&
        exec geth \
          --dev \
          --datadir /root/.ethereum \
          --dev.period=300 \
          --networkid=27744 \
          --http \
          --http.addr=0.0.0.0 \
          --http.corsdomain=* \
          --http.vhosts=* \
          --http.api=eth,net,web3,debug,txpool \
          --miner.gasprice=1000000 \
          --gcmode=archive
  explorer-backend:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    image: 'ghcr.io/blockscout/blockscout:9.0.2'
    container_name: blockscout-backend
    command:
      - sh
      - '-c'
      - "/app/bin/blockscout eval \"Explorer.ReleaseTasks.create_and_migrate\" &&\n/app/bin/blockscout start\n"
    environment:
      - DATABASE_URL
      - 'ETHEREUM_JSONRPC_HTTP_URL=http://ledger-node:8545'
      - 'ETHEREUM_JSONRPC_TRACE_URL=http://ledger-node:8545'
      - CHAIN_ID=27744
      - COIN=MASH
      - NETWORK=Family
      - MIGRATION_PRIMARY=true
      - ECTO_USE_SSL=false
      - ETHEREUM_JSONRPC_VARIANT=geth
      - INDEXER_CATCHUP_INTERVAL=5000
    depends_on:
      - ledger-node
  explorer-frontend:
    build:
      context: ./frontend
    container_name: blockscout-frontend
    ports:
      - '3000:80'
    environment:
      - NEXT_PUBLIC_NETWORK_ID=27744
      - NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL=MASH
      - 'NEXT_PUBLIC_NETWORK_CURRENCY_NAME=No i masz'
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - explorer-backend
volumes:
  ledger-data: null
